# Publica o site da solução (pasta site/) no GitHub Pages.
# Roda a cada push na main que mexa no site ou nos dados do modelo, ou à mão pela aba Actions.
name: Site no GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'ia/data/previsoes.json'
      - 'ia/data/resumo_modelo.json'
      - 'ia/data/lugares.csv'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez; um push novo cancela o que ainda estiver esperando.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci

      # Atualiza src/data com as previsões mais recentes de ia/data.
      - run: npm run dados

      # Checa os tipos (tsc --noEmit) e gera site/dist.
      - run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
